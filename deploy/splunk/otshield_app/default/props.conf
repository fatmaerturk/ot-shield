# CEF sourcetype parsing for OTShield's SIEM feed.
# - LINE_BREAKER: rapid UDP CEF datagrams merge into one event otherwise;
#   break on each "CEF:0|" header.
# - KV_MODE=none + REPORT-cef: default KV_MODE=auto splits multi-word values
#   (e.g. otSrcCountry=United States -> "United"); a real CEF extraction keeps
#   the whole value up to the next " key=".
# - DATETIME_CONFIG=CURRENT stamps live UDP events at ingest (the WSL/Docker
#   clock drifts vs the host). The HEC /event re-sync overrides this per event
#   with an explicit `time`, so historical events keep their real timeline.
[cef]
SHOULD_LINEMERGE = false
LINE_BREAKER = ()(?=CEF:0\|)
DATETIME_CONFIG = CURRENT
TRUNCATE = 10000
KV_MODE = none
REPORT-cef = cef_kv
