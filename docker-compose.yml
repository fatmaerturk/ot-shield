# OTShield single-VM production stack: Postgres + Spring Boot backend + nginx
# frontend. Only the frontend (port 80/443) is exposed publicly; backend and
# database stay on the internal compose network. See deploy/README.md.
#
# Values come from a .env file next to this one (copy .env.prod.template).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql/<major>; mount the
      # parent (NOT /var/lib/postgresql/data, which is the pre-18 convention).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: the DB is reachable only from the backend container.
    # For a one-off migration, temporarily add:  ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    restart: unless-stopped
    # Cap the JVM so it shares the box with Ollama, but not too tightly - 2g
    # strangled it (GeoIP mmap + vector store + Spring). 4g heap-ceiling ~3g,
    # leaving ~4g for Ollama + postgres on the 8g VM.
    mem_limit: 4g
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      HONEYPOT_INGEST_TOKEN: ${HONEYPOT_INGEST_TOKEN}
      # AI Research copilot: reach the Ollama container (overrides the localhost
      # default via Spring relaxed binding: OLLAMA_BASE_URL -> ollama.base-url).
      OLLAMA_BASE_URL: http://ollama:11434
      # MaxMind GeoLite2 dbs are not in git (license); mounted from the host below.
      GEOIP_DATABASE_PATH: /app/geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DATABASE_PATH: /app/geoip/GeoLite2-ASN.mmdb
      # SIEM forwarding: push live honeypot/breach CEF to the in-network Splunk
      # container. Overrides the prod default (off) via Spring relaxed binding
      # (SIEM_FORWARD_HOST -> siem.forward.host). UDP is fire-and-forget, so the
      # backend does not need to wait for Splunk to be up.
      SIEM_FORWARD_ENABLED: "true"
      SIEM_FORWARD_HOST: splunk
      SIEM_FORWARD_PORT: "1514"
      SIEM_FORWARD_PROTOCOL: UDP
      SIEM_FORWARD_FORMAT: CEF
      SIEM_FORWARD_MIN_SEVERITY: LOW
    volumes:
      # Copy backend/geoip/*.mmdb to the VM (they are git-ignored). Geo/ASN
      # enrichment degrades gracefully if absent, so this is optional.
      - ./backend/geoip:/app/geoip:ro
    # No published port: nginx (frontend) proxies to it as http://backend:8080.

  # Local LLM runtime for the Research copilot (embeddings + chat). Internal
  # only. Models are pulled after first start (see deploy/README.md).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  # Splunk demo target. OTShield forwards live CEF here (UDP 1514) and the
  # timeline re-sync backfills the honeypot history via HEC (8088). The CEF
  # parsing + the "OTShield - Live" dashboard ship as the mounted otshield_app.
  # Web UI (8000) is fronted by Caddy at ${SPLUNK_DOMAIN}; no port is published
  # to the host, so nothing is exposed except through Caddy.
  splunk:
    image: splunk/splunk:latest
    restart: unless-stopped
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      # Pre-provisions HEC (port 8088) with this token on first boot, so the
      # re-sync script can POST without a manual token-create step.
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    volumes:
      - splunk_var:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
      - ./deploy/splunk/otshield_app:/opt/splunk/etc/apps/otshield_app

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_CARTO_KEY: ${REACT_APP_CARTO_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"          # Caddy fronts it; not published to the host directly

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
      - splunk
    ports:
      - "80:80"
      - "443:443"
    environment:
      OTSHIELD_DOMAIN: ${OTSHIELD_DOMAIN}
      # Subdomain for the Splunk web UI (needs a DNS A record -> the static IP).
      SPLUNK_DOMAIN: ${SPLUNK_DOMAIN}
    volumes:
      - ./deploy/tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama_data:
  splunk_var:
  splunk_etc:
