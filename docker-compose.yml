# OTShield single-VM production stack: Postgres + Spring Boot backend + nginx
# frontend. Only the frontend (port 80/443) is exposed publicly; backend and
# database stay on the internal compose network. See deploy/README.md.
#
# Values come from a .env file next to this one (copy .env.prod.template).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql/<major>; mount the
      # parent (NOT /var/lib/postgresql/data, which is the pre-18 convention).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: the DB is reachable only from the backend container.
    # For a one-off migration, temporarily add:  ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    restart: unless-stopped
    # Cap the JVM so it shares the box with Ollama, but not too tightly - 2g
    # strangled it (GeoIP mmap + vector store + Spring). 4g heap-ceiling ~3g,
    # leaving ~4g for Ollama + postgres on the 8g VM.
    mem_limit: 4g
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      HONEYPOT_INGEST_TOKEN: ${HONEYPOT_INGEST_TOKEN}
      # AI Research copilot: reach the Ollama container (overrides the localhost
      # default via Spring relaxed binding: OLLAMA_BASE_URL -> ollama.base-url).
      OLLAMA_BASE_URL: http://ollama:11434
      # MaxMind GeoLite2 dbs are not in git (license); mounted from the host below.
      GEOIP_DATABASE_PATH: /app/geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DATABASE_PATH: /app/geoip/GeoLite2-ASN.mmdb
    volumes:
      # Copy backend/geoip/*.mmdb to the VM (they are git-ignored). Geo/ASN
      # enrichment degrades gracefully if absent, so this is optional.
      - ./backend/geoip:/app/geoip:ro
    # No published port: nginx (frontend) proxies to it as http://backend:8080.

  # Local LLM runtime for the Research copilot (embeddings + chat). Internal
  # only. Models are pulled after first start (see deploy/README.md).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_CARTO_KEY: ${REACT_APP_CARTO_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"          # Caddy fronts it; not published to the host directly

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      OTSHIELD_DOMAIN: ${OTSHIELD_DOMAIN}
    volumes:
      - ./deploy/tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama_data:
