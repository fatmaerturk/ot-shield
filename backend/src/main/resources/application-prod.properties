# =============================================================================
# Production profile - activate with:  SPRING_PROFILES_ACTIVE=prod
#
# This profile overrides the local-dev defaults in application.properties with
# a hardened posture. It intentionally provides NO fallback for secrets, so the
# app fails to start (fail closed) unless the operator supplies them via env.
# =============================================================================

# --- Secrets: REQUIRED from the environment (no dev fallback) ---------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
honeypot.ingest.token=${HONEYPOT_INGEST_TOKEN}

# --- Never re-run schema.sql / data.sql in production -----------------------
# The dev default is 'always', which DROPs and recreates tables on every boot.
# In production that would wipe live data, so we disable initialisation and
# manage the schema with migrations / an operator-controlled process instead.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

# --- Do not leak SQL, bind parameters, or security internals to logs --------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.safetech.otshield=INFO
