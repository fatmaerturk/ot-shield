# =============================================================================
# Production profile - activate with:  SPRING_PROFILES_ACTIVE=prod
#
# This profile overrides the local-dev defaults in application.properties with
# a hardened posture. It intentionally provides NO fallback for secrets, so the
# app fails to start (fail closed) unless the operator supplies them via env.
# =============================================================================

# --- Secrets: REQUIRED from the environment (no dev fallback) ---------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
honeypot.ingest.token=${HONEYPOT_INGEST_TOKEN}

# --- Never re-run schema.sql / data.sql in production -----------------------
# The dev default is 'always', which DROPs and recreates tables on every boot.
# In production that would wipe live data, so we disable initialisation and
# manage the schema with migrations / an operator-controlled process instead.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

# --- Do not leak SQL, bind parameters, or security internals to logs --------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.safetech.otshield=INFO

# SIEM forwarding: off by default in prod; the target is set per-deployment from
# the SIEM Forwarding page (or env vars), never auto-pointed at localhost.
siem.forward.enabled=false
siem.forward.host=
siem.forward.port=514

# Auth surface hardening: self-registration and the debug oracle OFF in prod.
auth.registration.enabled=false
auth.debug.enabled=false
# Fresh-deploy admin seed password (leave empty to skip seeding). For a MIGRATED
# db the admin already exists - change its password in the UI after migration.
admin.seed.password=${ADMIN_SEED_PASSWORD:}

# CORS: browsers send an Origin header on POSTs, so the PUBLIC URL must be
# allowed or Spring returns 403 "Invalid CORS request". Override via env if the
# domain changes or you add more origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://soc.otshield.io,http://136.112.1.226}
