# OTShield frontend: serve the SPA and reverse-proxy the backend on the same
# origin, so the browser never needs to know the backend's address (all calls
# are relative /api, /ws, /pcap). This is what makes the cloud deploy work.

upstream otshield_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;   # pcap uploads

    # --- REST API + Server-Sent Events (honeypot live feed) ---
    location /api/ {
        proxy_pass http://otshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;              # required for SSE (/api/honeypot/events)
        proxy_read_timeout 3600s;
    }

    # --- pcap upload / streaming ---
    location /pcap/ {
        proxy_pass http://otshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- WebSocket streams (threats, decoy, fake-HMI) ---
    location /ws/ {
        proxy_pass http://otshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # --- Content-hashed build assets: cache hard, never revalidate ---
    # CRA emits JS/CSS under /static/ with a content hash in the filename, so
    # the bytes at a given URL never change. A 1-year immutable Cache-Control
    # means lazy-loaded route chunks and full reloads are served from the
    # browser cache with zero round-trips after the first visit.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- SPA entrypoint: never cache, so new deploys are picked up at once ---
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # --- SPA: everything else falls back to index.html (client-side routing) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
